<h1>Models</h1>

This page lists models that can be downloaded by 
<a href="http://ptolemy.eecs.berkeley.edu/ptolemyII"
target="_top">Ptolemy II</a>
<p>To open a model inside Ptolemy II, 
do <code>File</code> -&gt; 
<code>Open URL</code>
and paste in a URL from the list below. 
<br>If you click on the link below, then the xml for the model will appear.
<ul>
<li> <a href="Waveform.xml"><code>http://ptolemy.eecs.berkeley.edu/xml/models/Waveform.xml</code></a>
