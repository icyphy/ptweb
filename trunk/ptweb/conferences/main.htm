<h1>Conferences</h1>

The Ptolemy Miniconference is an opportunity for users from industry
and education to get together and present their work to the Ptolemy community.

There have been three Ptolemy Miniconferences:
<a href="99/main.htm" target="main">1999</a>,
<a href="97/main.htm" target="main">1997</a> and
<a href="95/main.htm" target="main">1995</a>.
