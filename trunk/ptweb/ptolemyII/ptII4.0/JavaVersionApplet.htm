<center>
<!-- The HTML below is for the Java Plugin.
	The first section is for IE,
	the second is for appletviewer and Netscape Communicator
	the third is for anything that doesn't understand applets.
 -->
<!-- HTML CONVERTER -->
<SCRIPT LANGUAGE="JavaScript"><!--
    var _info = navigator.userAgent; 
    var _ns = false; 
    var _ns6 = false;
    var _ie = (_info.indexOf("MSIE") > 0 && _info.indexOf("Win") > 0 && _info.indexOf("Windows 3.1") < 0);
//--></SCRIPT>
    <COMMENT>
        <SCRIPT LANGUAGE="JavaScript1.1"><!--
        var _ns6 = (_info.indexOf("Mozilla/5") >= 0);
        var _ns = (navigator.appName.indexOf("Netscape") >= 0 && ((_info.indexOf("Win") > 0     && _info.indexOf("Win16") < 0 && java.lang.System.getProperty("os.version").indexOf("3.5") < 0) || (_info.indexOf("Sun") > 0) || (_info.indexOf("Linux") > 0) || (_info.indexOf("AIX") > 0) || (_info.indexOf("OS/2") > 0) || (_info.indexOf("IRIX") > 0 )));
//--></SCRIPT>
    </COMMENT>

<SCRIPT LANGUAGE="JavaScript"><!--
    if (_ie == true) document.writeln('\
        <OBJECT \
            classid="clsid:8AD9C840-044E-11D1-B3E9-00805F499D93" \
            width = "420" \
            height = "400"  \
            codebase="http://java.sun.com/products/plugin/autodl/jinstall-1_4_1_02-windows-i586.cab#Version=1,4,1,02"> \
            <PARAM NAME = "code" \
                   VALUE = "JavaVersionApplet" > \
	    <PARAM NAME = "codebase"   VALUE = "." > \
            <PARAM NAME = "NAME" VALUE = "JavaVersionApplet" > \
	    <PARAM NAME = "background" VALUE = "#faf0e6" > \
            <PARAM NAME = "scriptable" VALUE = "false" > \
            <PARAM NAME = "background" VALUE = "#faf0e6" > \
	    <PARAM NAME = "modelClass" VALUE = "ptolemy.domains.sdf.demo.Butterfly.Butterfly" > \
            Your browser could not find the plugin, you should install Java 1.4. \
        </OBJECT> \
        ');
    else if (_ns == true || _ns6 == true)
         document.writeln('\
        <COMMENT> \
          <EMBED \
            type = "application/x-java-applet;jpi-version=1.4.1_02" \
            code = "JavaVersionApplet" codebase = "." width = "280" \
            height = "150" \
            NAME = "JavaVersionApplet" background = "#faf0e6"  \
            scriptable = "false" \
            pluginspage = "http://java.sun.com/j2se/1.4.1/download.html"> \
              <NOEMBED> \
              <a href="Butterfly.xml">MoML specification for this model.</a> \
              </NOEMBED> \
           </EMBED> \
        <COMMENT> \
        ');
    else document.writeln('\
        <APPLET \
             code = "JavaVersionApplet" codebase = "." width = "280" \
            height = "150" \
            > \
            <PARAM NAME = "NAME" VALUE = "JavaVersionApplet" > \
	    <PARAM NAME = "background" VALUE = "#faf0e6" > \
            Your browser could not find the plugin, you should install Java 1.4. \
        </APPLET> \
        ');
//--></SCRIPT>
<!-- /HTML CONVERTER -->
</center>
