name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: ./bin/build-for-pages

      - name: Checkout EAL homepage
        uses: actions/checkout@v4
        with:
          repository: edwardalee/homepage
          path: homepage-src

      - name: Build EAL homepage into ~eal/
        run: homepage-src/bin/build-for-pages "_site/~eal"
        env:
          SITE_BASE_PATH: /~eal

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
