<h1>Registration</h1>

In order to register for the conference you will need a <a href=" https://chess.eecs.berkeley.edu/login/">CHESS</a> account. If your don't have one, request one <a href="https://chess.eecs.berkeley.edu/login/?subpage=Request">here</a>.</p>

<p>To register for the conference, go <a href="https://chess.eecs.berkeley.edu/chessj/servlet/WorkshopRegistration?workshopID=27">here</a>, log in with your CHESS credentials, and complete the form.
